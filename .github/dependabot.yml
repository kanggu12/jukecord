# Dependabot proposes newer versions once a week, in as few pull requests as it can: one for the actions the workflows
# use, one for the Node base image's digest, one for the images FFmpeg is built in for the release's programs, one for
# the monitoring example's Prometheus and Grafana, and one for the npm packages (a new major version of a package, which
# can break things, comes in a pull request of its own).
# Each pull request runs ci.yml, which builds and starts the image, and bundles.yml where the programs are touched.
# yt-dlp, FFmpeg, OpenSSL and the programs' Node.js are release files, not packages Dependabot knows:
# ytdlp-release.yml, ffmpeg-release.yml and node-release.yml watch those.
version: 2
updates:
  # The actions in .github/workflows, by version tag or by commit (then with the version in a comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The FROM lines of deploy/docker/Dockerfile: a newer digest of node:26-trixie-slim (Node's and Debian's fixes).
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    # The next major version of Node is a decision (the next LTS, with the tests run on it), not an update to take.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      base-image:
        patterns: ["*"]

  # The FROM lines of deploy/bundle/Dockerfile: Alpine and Debian, where FFmpeg is built for the programs.
  - package-ecosystem: docker
    directory: /deploy/bundle
    schedule:
      interval: weekly
    groups:
      build-images:
        patterns: ["*"]

  # The images of deploy/monitoring/compose.yaml, Prometheus and Grafana, by version and digest. A newer Prometheus
  # also needs ci.yml's promtool moved to the same release (tests/packaging/monitoring.test.ts says so).
  - package-ecosystem: docker-compose
    directory: /deploy/monitoring
    schedule:
      interval: weekly
    groups:
      monitoring-images:
        patterns: ["*"]

  # package.json and package-lock.json: the packages jukecord runs and the tools it is built and checked with.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Node's types stay on the oldest Node jukecord runs on (24): typed against a newer one, code could use what that
    # Node does not have, and the type check fails as it is.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

# Every push to main and every pull request: lint and types, the tests on Node 24 and 26 on both processors, the
# store on the six database servers it takes, the panel's build, the packaging checks, and the image built on an
# amd64 and an arm64 runner (no emulation) and started once on each. release.yml runs this before it publishes anything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Node ${{ matrix.node }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: ffmpeg with Opus, for the integration tests
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Lint (once is enough)
        if: matrix.node == '24' && matrix.runner == 'ubuntu-24.04'
        run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: The panel builds
        run: npm run build

  databases:
    # The store on every database jukecord takes, the oldest and the newest supported of each: the tests that run on
    # each database (eachDatabase, tests/support/databases.ts) run on SQLite and on these six. Each image is pinned by
    # its full version and its digest: Docker pulls by the digest, the version says what it is, and a newer one is a
    # change here (Dependabot does not read services). Their data is in memory (nothing to keep), and the job starts
    # once each takes connections.
    name: databases (PostgreSQL 14 and 18, MySQL 8.0 and 8.4, MariaDB 10.11 and 11.8)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres14:
        image: postgres:14.25-alpine@sha256:e7d9e6aac7fe3232f7661da103aebc0ce38b04105b46af5e9edd5ef6bc343f20
        env:
          POSTGRES_USER: jukecord
          POSTGRES_PASSWORD: jukecord
          POSTGRES_DB: jukecord
        ports:
          - 15433:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -h 127.0.0.1 -U jukecord" --health-interval 2s --health-timeout 5s
          --health-retries 60
      postgres18:
        image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_USER: jukecord
          POSTGRES_PASSWORD: jukecord
          POSTGRES_DB: jukecord
        ports:
          - 15432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -h 127.0.0.1 -U jukecord" --health-interval 2s --health-timeout 5s
          --health-retries 60
      mysql80:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: jukecord
          MYSQL_DATABASE: jukecord
        ports:
          - 13308:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pjukecord --silent" --health-interval 2s
          --health-timeout 5s --health-retries 90
      mysql84:
        image: mysql:8.4.13@sha256:8c233bad33d520a7aae1c1e619c3a9775f4a1ba2d463d692fada04ec7f40be00
        env:
          MYSQL_ROOT_PASSWORD: jukecord
          MYSQL_DATABASE: jukecord
        ports:
          - 13306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pjukecord --silent" --health-interval 2s
          --health-timeout 5s --health-retries 90
      mariadb1011:
        image: mariadb:10.11.19@sha256:e5fe75b2b9de0eb9f6f9a4d9c97272fb3a7480e389ccd487a786bab2a12cc0d7
        env:
          MARIADB_ROOT_PASSWORD: jukecord
          MARIADB_DATABASE: jukecord
        ports:
          - 13309:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-timeout 5s
          --health-retries 90
      mariadb118:
        image: mariadb:11.8.9@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
        env:
          MARIADB_ROOT_PASSWORD: jukecord
          MARIADB_DATABASE: jukecord
        ports:
          - 13307:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-timeout 5s
          --health-retries 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The tests that run on each database, on SQLite and the six above
        env:
          # Space-separated, as tests/support/databases.ts reads them; root on MySQL and MariaDB, which make a database
          # for each test file.
          JUKECORD_TEST_DATABASES: >-
            postgres://jukecord:jukecord@127.0.0.1:15433/jukecord
            postgres://jukecord:jukecord@127.0.0.1:15432/jukecord
            mysql://root:jukecord@127.0.0.1:13308/jukecord
            mysql://root:jukecord@127.0.0.1:13306/jukecord
            mysql://root:jukecord@127.0.0.1:13309/jukecord
            mysql://root:jukecord@127.0.0.1:13307/jukecord
        # Every test file that has suites for each database, found by what it calls (none left out when one is added).
        run: |
          files=$(grep -l "eachDatabase(" tests/unit/*.test.ts tests/integration/*.test.ts)
          echo "$files"
          # shellcheck disable=SC2086
          node --disable-warning=ExperimentalWarning --test --test-reporter=spec $files

  packaging:
    name: packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # By commit, as in release.yml, where it runs with a token that may write.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.4
      - name: kubeconform, checked against its release's checksum
        run: |
          curl -fsSL --retry 4 --retry-delay 5 --max-time 120 -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: One version everywhere
        run: node scripts/check-version.ts
      - name: The chart, the workflows, the scripts, the changelog and the API document
        run: node --test "tests/packaging/**/*.test.ts"
      - name: Shell scripts (the version GitHub's runners carry, warnings and up)
        # A block, so the shell gets the line break after the backslash (a plain YAML string folds it into a space).
        run: |
          docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.9.0 --severity=warning /mnt/jukecord \
            /mnt/deploy/kind/check.sh /mnt/tests/ui/run.sh /mnt/deploy/bundle/ffmpeg.sh /mnt/deploy/bundle/build-ffmpeg.sh \
            /mnt/deploy/bundle/jukecord

  image:
    name: image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: jukecord:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Starts, answers, and finds its parts (browser-only, no network needed)
        run: |
          # As Compose and the chart run it: read-only, without capabilities, unable to gain privileges.
          docker run -d --name smoke --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001 jukecord:ci
          for _ in $(seq 1 30); do
            docker exec smoke node -e "fetch('http://127.0.0.1:8795/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && break
            sleep 1
          done
          docker exec smoke jukecord status
          docker exec smoke jukecord doctor
          docker exec smoke sh -c 'ffmpeg -hide_banner -encoders | grep -q libopus && /opt/yt-dlp/yt-dlp --version'
          # The FFmpeg built in the image, through jukecord's own three jobs: a cached file from a pipe (loudness evened
          # out), a stream from the middle of it, and the MP3 copy.
          docker exec smoke sh -c '
            set -e
            ffmpeg -hide_banner -loglevel error -filter_complex "anoisesrc=d=8:c=pink:a=0.2" -ac 2 -c:a pcm_s16le -f wav pipe:1 |
              ffmpeg -hide_banner -loglevel error -nostdin -i pipe:0 -vn -af "loudnorm=I=-14:TP=-1:LRA=11,afade=t=in:d=3" -ar 48000 -ac 2 -c:a libopus -b:a 128k -frame_duration 20 -application audio -f ogg /tmp/t.ogg
            ffmpeg -hide_banner -loglevel error -nostdin -ss 4 -i /tmp/t.ogg -af afade=t=in:d=0.12 -c:a libopus -b:a 128k -f ogg /tmp/s.ogg
            ffmpeg -hide_banner -loglevel error -nostdin -i /tmp/t.ogg -c:a libmp3lame -b:a 192k -f mp3 /tmp/t.mp3
            test "$(wc -c < /tmp/t.ogg)" -gt 50000 && test "$(wc -c < /tmp/s.ogg)" -gt 20000 && test "$(wc -c < /tmp/t.mp3)" -gt 50000'
          docker logs smoke
          docker rm -f smoke
          # The image stays lean: FFmpeg is built for audio here, and Debian's package (about 450 MB) does not come back.
          size=$(docker image inspect jukecord:ci --format '{{.Size}}')
          echo "image: $((size / 1000000)) MB"
          test "$size" -lt 500000000

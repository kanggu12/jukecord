# Every push to main and every pull request: lint and types, the tests on Node 24 and 26 on both processors, the
# panel's build, the packaging checks, and the image built on an amd64 and an arm64 runner (no emulation) and
# started once on each. release.yml runs this before it publishes anything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Node ${{ matrix.node }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: ffmpeg with Opus, for the integration tests
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Lint (once is enough)
        if: matrix.node == '24' && matrix.runner == 'ubuntu-24.04'
        run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: The panel builds
        run: npm run build

  packaging:
    name: packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: kubeconform, checked against its release's checksum
        run: |
          curl -fsSL --retry 4 --retry-delay 5 --max-time 120 -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: One version everywhere
        run: node scripts/check-version.ts
      - name: The chart, the workflows, the scripts, the changelog and the API document
        run: node --test "tests/packaging/**/*.test.ts"
      - name: Shell scripts (the version GitHub's runners carry, warnings and up)
        run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.9.0 --severity=warning /mnt/jukecord /mnt/deploy/kind/check.sh /mnt/tests/ui/run.sh

  image:
    name: image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: jukecord:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Starts, answers, and finds its parts (browser-only, no network needed)
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001 jukecord:ci
          for _ in $(seq 1 30); do
            docker exec smoke node -e "fetch('http://127.0.0.1:8795/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && break
            sleep 1
          done
          docker exec smoke jukecord status
          docker exec smoke jukecord doctor
          docker exec smoke sh -c 'ffmpeg -hide_banner -encoders | grep -q libopus && /opt/yt-dlp/yt-dlp --version'
          # The FFmpeg built in the image, through jukecord's own three jobs: a cached file from a pipe (loudness evened
          # out), a stream from the middle of it, and the MP3 copy.
          docker exec smoke sh -c '
            set -e
            ffmpeg -hide_banner -loglevel error -filter_complex "anoisesrc=d=8:c=pink:a=0.2" -ac 2 -c:a pcm_s16le -f wav pipe:1 |
              ffmpeg -hide_banner -loglevel error -nostdin -i pipe:0 -vn -af "loudnorm=I=-14:TP=-1:LRA=11,afade=t=in:d=3" -ar 48000 -ac 2 -c:a libopus -b:a 128k -frame_duration 20 -application audio -f ogg /tmp/t.ogg
            ffmpeg -hide_banner -loglevel error -nostdin -ss 4 -i /tmp/t.ogg -af afade=t=in:d=0.12 -c:a libopus -b:a 128k -f ogg /tmp/s.ogg
            ffmpeg -hide_banner -loglevel error -nostdin -i /tmp/t.ogg -c:a libmp3lame -b:a 192k -f mp3 /tmp/t.mp3
            test "$(wc -c < /tmp/t.ogg)" -gt 50000 && test "$(wc -c < /tmp/s.ogg)" -gt 20000 && test "$(wc -c < /tmp/t.mp3)" -gt 50000'
          docker logs smoke
          docker rm -f smoke
          # The image stays lean: FFmpeg is built for audio here, and Debian's package (about 450 MB) does not come back.
          size=$(docker image inspect jukecord:ci --format '{{.Size}}')
          echo "image: $((size / 1000000)) MB"
          test "$size" -lt 500000000

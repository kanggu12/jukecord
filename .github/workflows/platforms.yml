# jukecord on macOS and Windows, which the release's programs run on: the unit tests on each, on the Node.js line the
# programs carry. Linux runs them in ci.yml (Node 24 and 26, on x64 and arm64), and every program runs end to end on
# its own system and processor in bundles.yml. release.yml runs this before it publishes anything.
name: platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      # The files as the repository has them, with Linux line endings, as the tests read them on Linux.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit

# Once a week: whether a newer FFmpeg release of the same line (7.1) is out than the one the image and the release's
# programs build, and a newer OpenSSL of its line than the one the Linux programs' FFmpeg holds. FFmpeg reads media
# from any site, so its fixes matter, and nothing else would say so: both build FFmpeg from a pinned release instead
# of taking a package. The check fails (red on the Actions page, and a notice to the repository's owner) until
# FFMPEG_VERSION and FFMPEG_SHA256, or deploy/bundle/ffmpeg.sh's OpenSSL, are bumped (CONTRIBUTING.md, "FFmpeg"). A
# newer FFmpeg line (8.0 after 7.1) only adds a notice to the run: moving to it is a choice to make, not a fix to take.
name: ffmpeg-release

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The newest release of the pinned line, against the pinned one
        run: |
          pinned=$(sed -n 's/^ARG FFMPEG_VERSION=//p' deploy/docker/Dockerfile)
          # The line is the first two numbers: FFmpeg names a line's first release X.Y (9.0), the next ones X.Y.Z.
          line=$(printf '%s' "$pinned" | cut -d. -f1-2)
          # Every release on the download page, oldest first.
          releases=$(curl -fsSL --retry 3 --max-time 60 https://ffmpeg.org/releases/ |
            grep -oE 'ffmpeg-[0-9]+(\.[0-9]+)+\.tar\.xz' | sed 's/^ffmpeg-//; s/\.tar\.xz$//' | sort -uV)
          newest=$(printf '%s\n' "$releases" | grep -E "^${line//./\\.}(\.[0-9]+)?$" | tail -n 1)
          # The newest release of any line, and its line (9.0 for 9.0.2).
          latest=$(printf '%s\n' "$releases" | tail -n 1)
          latest_line=$(printf '%s' "$latest" | cut -d. -f1-2)
          echo "pinned: $pinned; newest of $line: ${newest:-none found}; newest of all: ${latest:-none found}"
          test -n "$newest"
          if [ "$latest_line" != "$line" ] && [ "$(printf '%s\n%s\n' "$line" "$latest_line" | sort -V | tail -n 1)" = "$latest_line" ]; then
            echo "::notice::FFmpeg $latest is out, of a newer line than $line, which the image builds; moving to it is a choice to make (CONTRIBUTING.md, FFmpeg)"
          fi
          if [ "$newest" != "$pinned" ]; then
            echo "::error::FFmpeg $newest is out; the image builds $pinned (bump it: CONTRIBUTING.md, FFmpeg)"
            exit 1
          fi
      # The Linux programs' FFmpeg holds OpenSSL for https, built from its release (deploy/bundle/ffmpeg.sh); the image
      # takes Debian's, which Dependabot's base updates bring.
      - name: The newest OpenSSL of the line the Linux programs' FFmpeg holds, against the pinned one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^OPENSSL_VERSION=//p' deploy/bundle/ffmpeg.sh)
          line=$(printf '%s' "$pinned" | cut -d. -f1-2)
          # OpenSSL's releases are tagged openssl-3.5.9; the line's newest sorts last.
          newest=$(gh api "repos/openssl/openssl/releases?per_page=100" --jq '.[].tag_name' |
            sed -n "s/^openssl-\(${line//./\\.}\.[0-9]*\)$/\1/p" | sort -V | tail -n 1)
          echo "pinned: $pinned; newest of $line: ${newest:-none found}"
          test -n "$newest"
          if [ "$newest" != "$pinned" ]; then
            echo "::error::OpenSSL $newest is out; the Linux programs' FFmpeg holds $pinned (deploy/bundle/ffmpeg.sh: OPENSSL_VERSION and OPENSSL_SHA256)"
            exit 1
          fi

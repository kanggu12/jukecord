# The Helm chart on a throwaway kind cluster with the image built from this commit (deploy/kind/check.sh): helm test,
# the jukecord command in the pod, data kept across a new pod, and the NetworkPolicy applied. It runs when the chart,
# the image or the code inside it changes, on main and in pull requests (before such a change is merged, not after),
# by hand, and from release.yml before anything is published.
name: chart-e2e

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "src/**"
      - "panel/**"
      - "package*.json"
      - "scripts/**"
      - ".dockerignore"
      - ".github/workflows/chart-e2e.yml"
  # The same paths as above.
  pull_request:
    paths:
      - "deploy/**"
      - "src/**"
      - "panel/**"
      - "package*.json"
      - "scripts/**"
      - ".dockerignore"
      - ".github/workflows/chart-e2e.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: chart-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: the chart on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: jukecord:e2e
          cache-from: type=gha,scope=linux/amd64
      # By commit, as in release.yml, where it runs with a token that may write.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.4
      - name: kind, checked against its release's checksum
        run: |
          curl -fsSL --retry 4 --retry-delay 5 --max-time 120 -o /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64
          # The sum the release publishes (kind-linux-amd64.sha256sum), written here so a changed file is noticed.
          echo "c72eda46430f065fb45c5f70e7c957cc9209402ef309294821978677c8fb3284  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
      - name: Install the chart on a throwaway cluster and check it
        run: deploy/kind/check.sh jukecord:e2e

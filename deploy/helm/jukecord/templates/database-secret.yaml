{{- if and .Values.database.url (not .Values.database.existingSecret) }}
# The database's address from the values, which holds its password. Prefer database.existingSecret, so the values file
# holds no secret: kubectl create secret generic jukecord-database --from-literal=url='postgres://...'
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jukecord.databaseSecretName" . }}
  labels:
    {{- include "jukecord.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.database.url | quote }}
{{- end }}

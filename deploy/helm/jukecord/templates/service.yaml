{{- /* Values an upgrade carried over from an older release are completed first (jukecord.defaults, _helpers.tpl). */ -}}
{{- include "jukecord.defaults" . -}}
# The panel and the API inside the cluster (an Ingress, kubectl port-forward, or another Service in front of it): the
# one pod, or in split mode the edges.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jukecord.fullname" . }}
  labels:
    {{- include "jukecord.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- if eq .Values.mode "split" }}
    {{- include "jukecord.partSelector" (list . "edge") | nindent 4 }}
    {{- else }}
    {{- include "jukecord.selectorLabels" . | nindent 4 }}
    {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP

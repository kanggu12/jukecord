{{- if include "jukecord.serviceMonitor" . }}
# What the Prometheus Operator scrapes: /metrics on jukecord's Service, with the metrics token when there is one (the
# Operator reads it from the Secret, in this namespace). In split mode the panel's Service is the edges', each one
# scraped, and the core's Service is scraped on its own port too.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "jukecord.fullname" . }}
  labels:
    {{- include "jukecord.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "jukecord.selectorLabels" . | nindent 6 }}
    {{- if eq .Values.mode "split" }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [server, core]
    {{- else }}
      app.kubernetes.io/component: server
    {{- end }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- if include "jukecord.readsMetricsToken" . }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "jukecord.metricsSecretName" . }}
          key: metricsToken
      {{- end }}
{{- end }}

{{- /* Values an upgrade carried over from an older release are completed first (jukecord.defaults, _helpers.tpl). */ -}}
{{- include "jukecord.defaults" . -}}
{{- if include "jukecord.makesAuthSecret" . }}
# The OIDC client's secret and the directory's bind password from the values (auth.oidc.clientSecret,
# auth.ldap.bindPassword). Prefer an existingSecret of yours, so the values file holds no secret:
#   kubectl create secret generic jukecord-auth --from-literal=oidcClientSecret=... --from-literal=ldapBindPassword=...
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jukecord.authSecretName" . }}
  labels:
    {{- include "jukecord.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (include "jukecord.oidcOn" .) .Values.auth.oidc.clientSecret (not .Values.auth.oidc.existingSecret) }}
  oidcClientSecret: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
  {{- if and (include "jukecord.ldapOn" .) .Values.auth.ldap.bindPassword (not .Values.auth.ldap.existingSecret) }}
  ldapBindPassword: {{ .Values.auth.ldap.bindPassword | quote }}
  {{- end }}
{{- end }}

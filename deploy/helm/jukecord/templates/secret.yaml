{{- if and (not .Values.discord.existingSecret) (or .Values.discord.token .Values.discord.clientSecret) }}
# The bot's token and the OAuth secret from the values. Prefer discord.existingSecret, so the values file holds no
# secret: kubectl create secret generic jukecord-discord --from-literal=token=... --from-literal=clientSecret=...
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jukecord.fullname" . }}
  labels:
    {{- include "jukecord.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.discord.token }}
  token: {{ . | quote }}
  {{- end }}
  {{- with .Values.discord.clientSecret }}
  clientSecret: {{ . | quote }}
  {{- end }}
{{- end }}

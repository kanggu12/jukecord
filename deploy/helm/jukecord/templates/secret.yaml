{{- if include "jukecord.makesSecret" . }}
# The bot's token and the OAuth secret from the values, and the metrics token. Prefer discord.existingSecret and
# metrics.existingSecret, so the values file holds no secret:
#   kubectl create secret generic jukecord-discord --from-literal=token=... --from-literal=clientSecret=...
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jukecord.fullname" . }}
  labels:
    {{- include "jukecord.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.discord.existingSecret }}
  {{- with .Values.discord.token }}
  token: {{ . | quote }}
  {{- end }}
  {{- with .Values.discord.clientSecret }}
  clientSecret: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if not .Values.metrics.existingSecret }}
  {{- with .Values.metrics.token }}
  metricsToken: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}

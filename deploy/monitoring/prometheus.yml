# Prometheus for the Compose example beside it: scrapes jukecord on Compose's network and loads its alert rules.
# The same scrape job works for any Prometheus that reaches jukecord's port.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: jukecord
    static_configs:
      # The service's name on jukecord's Compose network, and its port inside the container.
      - targets: ["jukecord:8795"]
    # From outside jukecord's network or through a proxy, jukecord answers only with its metrics token
    # (JUKECORD_METRICS_TOKEN); Prometheus sends it from a file:
    # authorization:
    #   credentials_file: /etc/prometheus/jukecord-metrics-token

# What the chart's split mode needs beside it on the throwaway cluster of deploy/kind/check-split.sh: a PostgreSQL and
# a Valkey over TLS, each a single pod with nothing kept on disk (the cluster goes away with them). The database's
# password is the Secret jukecord-test-database, and Valkey's certificate the Secret jukecord-test-bus-tls, both of which
# the script makes first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
          env:
            - name: POSTGRES_USER
              value: jukecord
            - name: POSTGRES_DB
              value: jukecord
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jukecord-test-database
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, jukecord, -d, jukecord]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
          # Over TLS only, with a certificate an authority made for the run signed (the Secret jukecord-test-bus-tls,
          # which the script makes): jukecord's pods reach it only by trusting that authority through the chart's ca.
          args:
            - valkey-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --port
            - "0"
            - --tls-port
            - "6379"
            - --tls-cert-file
            - /tls/server.crt
            - --tls-key-file
            - /tls/server.key
            - --tls-ca-cert-file
            - /tls/ca.crt
            - --tls-auth-clients
            - "no"
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: [valkey-cli, --tls, --cacert, /tls/ca.crt, -h, localhost, ping]
            periodSeconds: 2
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: jukecord-test-bus-tls
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector:
    app: valkey
  ports:
    - port: 6379

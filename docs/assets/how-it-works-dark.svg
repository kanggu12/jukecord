<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="How jukecord works. You and your friends use slash commands in Discord, the panel, the jukecord command or the HTTP API, and every one of them goes through the same actions and the same DJ role check. jukecord fetches tracks from YouTube, SoundCloud and the other sites yt-dlp reads, through its own proxy that connects only to public addresses, evens out their loudness once and keeps them as Opus. One player per Discord server is the clock: the bot plays the track in the voice channel from the clock&#x27;s place, and a browser that presses Listen here plays the same file and stays within 0.3 seconds of the clock. Rainbow lines are the music people hear; grey lines are everything else." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How jukecord works. You and your friends use slash commands in Discord, the panel, the jukecord command or the HTTP API, and every one of them goes through the same actions and the same DJ role check. jukecord fetches tracks from YouTube, SoundCloud and the other sites yt-dlp reads, through its own proxy that connects only to public addresses, evens out their loudness once and keeps them as Opus. One player per Discord server is the clock: the bot plays the track in the voice channel from the clock&#x27;s place, and a browser that presses Listen here plays the same file and stays within 0.3 seconds of the clock. Rainbow lines are the music people hear; grey lines are everything else.</title>

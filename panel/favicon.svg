<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>jukecord</title>
  <!-- The jukecord mark: a jukebox's arch, lit in the colours of "playing now", with a record under it. -->
  <style>
    .ink { fill: #171717; }
    @media (prefers-color-scheme: dark) { .ink { fill: #e3e4e5; } }
  </style>
  <defs>
    <linearGradient id="arch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6f61"/>
      <stop offset=".26" stop-color="#ffb84d"/>
      <stop offset=".5" stop-color="#4fcf86"/>
      <stop offset=".74" stop-color="#4aa3ff"/>
      <stop offset="1" stop-color="#a77bff"/>
    </linearGradient>
  </defs>
  <path d="M12 61V31a20 20 0 0 1 40 0v30" fill="none" stroke="url(#arch)" stroke-width="7.5"/>
  <!-- The record: the disc, the label ring left open (whatever is behind shows), and the spindle hole's rim. -->
  <path class="ink" fill-rule="evenodd" d="M32 26.5a12.5 12.5 0 1 1 0 25a12.5 12.5 0 1 1 0-25zM32 34.4a4.6 4.6 0 1 0 0 9.2a4.6 4.6 0 1 0 0-9.2zM32 37.5a1.5 1.5 0 1 1 0 3a1.5 1.5 0 1 1 0-3z"/>
</svg>

# jukecord with Docker Compose. The front door (./jukecord up) runs this; `docker compose up -d` does the same.
#
# The panel is published on this machine only (127.0.0.1). Settings come from .env beside this file (copy
# .env.example); the database, the media cache and the logs live in the named volume jukecord-data, which Docker lists
# as jukecord_jukecord-data (the project's name first). Needs Compose 2.24 or newer (env_file with required: false).
# A second copy on the same machine sets COMPOSE_PROJECT_NAME and JUKECORD_PORT in its own .env (docs/INSTALL.md).
name: jukecord

services:
  jukecord:
    # A local build by default; set JUKECORD_IMAGE to a released image (ghcr.io/<owner>/jukecord:<version>) to pull one.
    image: ${JUKECORD_IMAGE:-jukecord:local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - path: .env
        required: false
    # Fixed inside the container whatever .env says: the port and address are the image's, the data is the volume.
    environment:
      JUKECORD_HOST: 0.0.0.0
      JUKECORD_PORT: "8795"
      JUKECORD_DATA_DIR: /data
      # The port outside the container, for links and the Discord login when there is no public address.
      JUKECORD_PUBLISHED_PORT: "${JUKECORD_PORT:-8795}"
      # The host's time zone (the front door sets it from this machine, or TZ in .env): "today" in the statistics and
      # the time of day of scheduled backups are the host's. UTC when nothing says.
      TZ: "${TZ:-UTC}"
    ports:
      # JUKECORD_BIND=0.0.0.0 opens the panel to the network (for friends on the same network, or a reverse proxy).
      - "${JUKECORD_BIND:-127.0.0.1}:${JUKECORD_PORT:-8795}:8795"
    volumes:
      - jukecord-data:/data
    restart: unless-stopped
    # The image writes only to /data and /tmp; everything else is read-only, and the process gains no privileges.
    read_only: true
    tmpfs:
      # Scratch space for yt-dlp and ffmpeg, which keep little there. Bounded, since a tmpfs lives in memory and what
      # it holds counts against mem_limit below.
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Node with the panel open in many browsers uses about 200 MB, and each track being fetched adds a yt-dlp and an
    # ffmpeg of about 70 MB each. Node sets its heap ceiling at about half of this limit, so 1g leaves it about 512 MiB.
    # Past the limit the kernel ends the container and Docker starts it again, instead of the whole machine swapping.
    mem_limit: 1g
    # The same as mem_limit (this one counts memory and swap together), so the container gets no swap on top.
    memswap_limit: 1g
    # Node's threads plus a yt-dlp and an ffmpeg (about 20 threads each) for every track being fetched stay far below
    # this; a program that runs away cannot fill the machine's process table.
    pids_limit: 1024
    # jukecord saves where every server was and leaves voice within 10 s of SIGTERM.
    stop_grace_period: 15s
    # Docker's own log of the console lines, bounded (jukecord's JSON log in the volume has its own rotation).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  jukecord-data:
